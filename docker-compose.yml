version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: task_manager_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: taskpassword123
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432" # Allows you to connect using database GUI clients (like DBeaver or pgAdmin)
    volumes:
      - pgdata:/var/lib/postgresql/data # Persists the database data even when containers stop

  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_app
    restart: always
    ports:
      - "9000:9000" # Exposes Express server port 9000 to your host machine
    environment:
      - PORT=9000
      - DATABASE_URL=postgresql://postgres:taskpassword123@db:5432/task_manager?schema=public
    depends_on:
      - db # Ensures the database starts before the application
    volumes:
      - .:/app # Syncs your local files for hot-reloading (ideal for development)
      - /app/node_modules # Avoids overwriting the container's node_modules with local ones

volumes:
  pgdata:
